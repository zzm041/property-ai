name: ${COMPOSE_PROJECT_NAME:-property-ai-delivery-check}

# Reproducible single-host delivery artifact.  Application processes never
# migrate automatically; run the one-shot `migrate` service explicitly.
x-app-image: &app-image
  image: property-ai-delivery:${DELIVERY_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  mysql:
    image: mysql:8.0.41@sha256:bf577825b52ab281d6281fb281eabbfdc73507eda8f2c2745790251533ef0306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3327}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6392}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    # Preserve the existing Mnesia node identity across container recreation.
    hostname: df276253ad68
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-property_ai_delivery_check}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5685}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15685}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.16@sha256:d967d98a12dc220a1a290794711dba7eba04b8ce465e12b02383d1bfbb33e159
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ALLOW_NONE_AUTHENTICATION: "yes"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9020}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9021}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.10@sha256:02e1d60d71ab60f435c60076f4fed2abe59602ecd5e18dcfe229c8c558c4379d
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19541}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-9094}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  migrate:
    <<: *app-image
    profiles: ["tools"]
    env_file:
      - ${DELIVERY_ENV_FILE:-.env.delivery}
    command: ["python", "-m", "app.cli.delivery_migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *app-image
    profiles: ["tools"]
    env_file: ${DELIVERY_ENV_FILE:-.env.delivery}
    environment:
      PROPERTY_AI_DELIVERY_STORAGE_INIT: approved
    command: ["python", "-m", "app.cli.delivery_storage_init"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api: &application
    <<: *app-image
    env_file: ${DELIVERY_ENV_FILE:-.env.delivery}
    environment:
      LOCAL_AI_INTERNAL_TOKEN: ${LOCAL_AI_INTERNAL_TOKEN:-${DELIVERY_RAG_INTERNAL_TOKEN:-}}
      LLM_API_KEY: ${LLM_API_KEY:-${DELIVERY_WORK_AI_INTERNAL_TOKEN:-}}
      VLM_API_KEY: ${VLM_API_KEY:-${DELIVERY_WORK_AI_INTERNAL_TOKEN:-}}
      ASR_API_KEY: ${ASR_API_KEY:-${DELIVERY_WORK_AI_INTERNAL_TOKEN:-}}
      DISPATCH_REJECT_COOLDOWN_SECONDS: ${DISPATCH_REJECT_COOLDOWN_SECONDS:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *application
    command: ["sh", "-c", "exec celery -A app.worker.celery_app.celery_app worker --loglevel=info -Q \"$${CELERY_TASK_QUEUE}\" --concurrency=1"]
    # PA-104-D: real probe — a worker that stopped consuming must be unhealthy.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck", "worker"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  publisher:
    <<: *application
    command: ["python", "-m", "app.worker.task_intent_publisher", "--seconds", "3600"]
    # PA-104-D: real probe — heartbeat freshness plus broker reachability.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck", "publisher"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat-volume-init:
    <<: *app-image
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 /var/run/property-ai && chown -R 10001:10001 /var/run/property-ai"]
    volumes:
      - beat_state:/var/run/property-ai
    restart: "no"

  beat:
    <<: *application
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/var/run/property-ai/celerybeat-schedule"]
    volumes:
      - beat_state:/var/run/property-ai
    depends_on:
      beat-volume-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-8093}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-property-ai-delivery-check-mysql-data-v2}
  redis_data:
  rabbitmq_data:
  etcd_data:
  minio_data:
  milvus_data:
  beat_state:
