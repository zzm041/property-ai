name: property-ai-prodlike

# Disposable production-like rehearsal. Volumes are isolated from development
# `property-ai` / `mysql_data`. Never point this file at the development volume.
# `docker compose -f deploy/docker-compose.prodlike.yml down -v` is allowed here.
# Do not run `down -v` against deploy/docker-compose.yml.

services:
  mysql:
    image: mysql:8.0.41
    environment:
      MYSQL_DATABASE: property_ai_staging
      MYSQL_USER: property
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me-root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3316:3306"
    volumes:
      - prodlike_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - prodlike_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: property
      RABBITMQ_DEFAULT_PASS: change-me
      RABBITMQ_DEFAULT_VHOST: property_ai_staging
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - prodlike_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ALLOW_NONE_AUTHENTICATION: "yes"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - prodlike_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - prodlike_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9092:9091"
    volumes:
      - prodlike_milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: staging
      APP_SECRET_KEY: staging-rehearsal-secret-key-not-for-production
      APP_DEBUG: "false"
      DEV_AUTH_ENABLED: "false"
      WECHAT_LOGIN_ENABLED: "true"
      WECHAT_PROVIDER: development
      WECHAT_APP_ID: wx-dev-app
      AI_ENQUEUE_ON_CREATE: "true"
      LLM_PROVIDER: development
      VLM_PROVIDER: development
      ASR_PROVIDER: development
      EMBEDDING_PROVIDER: development
      RERANKER_PROVIDER: development
      STORAGE_PROVIDER: production
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: property-ai-staging
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      DATABASE_URL: mysql+pymysql://property:change-me@mysql:3306/property_ai_staging?charset=utf8mb4
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: amqp://property:change-me@rabbitmq:5672/property_ai_staging
      CELERY_TASK_QUEUE: property_ai.staging
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: knowledge_chunks_staging
      EMBEDDING_DIMENSIONS: "8"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "1800"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "property_ai.staging",
      ]
    environment:
      APP_ENV: staging
      APP_SECRET_KEY: staging-rehearsal-secret-key-not-for-production
      APP_DEBUG: "false"
      DEV_AUTH_ENABLED: "false"
      WECHAT_LOGIN_ENABLED: "true"
      WECHAT_PROVIDER: development
      WECHAT_APP_ID: wx-dev-app
      AI_ENQUEUE_ON_CREATE: "true"
      LLM_PROVIDER: development
      VLM_PROVIDER: development
      ASR_PROVIDER: development
      EMBEDDING_PROVIDER: development
      RERANKER_PROVIDER: development
      STORAGE_PROVIDER: production
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: property-ai-staging
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      DATABASE_URL: mysql+pymysql://property:change-me@mysql:3306/property_ai_staging?charset=utf8mb4
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: amqp://property:change-me@rabbitmq:5672/property_ai_staging
      CELERY_TASK_QUEUE: property_ai.staging
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: knowledge_chunks_staging
      EMBEDDING_DIMENSIONS: "8"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "1800"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      APP_ENV: staging
      APP_SECRET_KEY: staging-rehearsal-secret-key-not-for-production
      APP_DEBUG: "false"
      DEV_AUTH_ENABLED: "false"
      DATABASE_URL: mysql+pymysql://property:change-me@mysql:3306/property_ai_staging?charset=utf8mb4
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: amqp://property:change-me@rabbitmq:5672/property_ai_staging
      CELERY_TASK_QUEUE: property_ai.staging
      SLA_SWEEP_INTERVAL_SECONDS: "30"
      NOTIFICATION_RETRY_SWEEP_INTERVAL_SECONDS: "30"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_RECYCLE_SECONDS: "1800"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - property_ai_prodlike

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - property_ai_prodlike

networks:
  property_ai_prodlike:
    driver: bridge

volumes:
  prodlike_mysql_data:
  prodlike_redis_data:
  prodlike_rabbitmq_data:
  prodlike_etcd_data:
  prodlike_minio_data:
  prodlike_milvus_data:
